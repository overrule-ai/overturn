name: Release

# Actions → Release → "Run workflow" on main. Publishes @overturn-ai/shared, @overturn-ai/sdk and
# overturn to npm and overturn to PyPI at the version in package.json / pyproject.toml, then
# tags v<version> and creates the GitHub release. Needs NPM_TOKEN and PYPI_TOKEN secrets.
on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency: release

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          v=$(node -p "require('./packages/sdk/package.json').version")
          for f in packages/shared/package.json packages/cli/package.json; do
            [ "$(node -p "require('./$f').version")" = "$v" ] || { echo "$f is not at $v"; exit 1; }
          done
          grep -q "^version = \"$v\"" packages/sdk-python/pyproject.toml || { echo "pyproject.toml is not at $v"; exit 1; }
          if git ls-remote --tags origin "refs/tags/v$v" | grep -q .; then echo "tag v$v already exists"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: version
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @overturn-ai/shared --filter @overturn-ai/sdk --filter overturn-cli build
      - name: Publish (skips versions already on npm, so a rerun is safe)
        run: |
          for dir in packages/shared packages/sdk packages/cli; do
            name=$(node -p "require('./$dir/package.json').name"); v=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$v" version >/dev/null 2>&1; then echo "$name@$v already published, skipping"; continue; fi
            (cd "$dir" && pnpm publish --access public --no-git-checks)
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: version
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
        working-directory: packages/sdk-python
      - run: uv publish --token "$PYPI_TOKEN" --check-url https://pypi.org/simple/
        working-directory: packages/sdk-python
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}

  tag:
    name: Tag and GitHub release
    runs-on: ubuntu-latest
    needs: [version, npm, pypi]
    steps:
      - uses: actions/checkout@v4
      - run: |
          git tag "v$V" && git push origin "v$V"
          gh release create "v$V" --generate-notes --title "v$V"
        env:
          V: ${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
