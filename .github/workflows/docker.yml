name: Docker images

on:
  push:
    branches: [main]
    paths: ["apps/**", "packages/shared/**", "pnpm-lock.yaml", "docker-compose.yml", ".github/workflows/docker.yml"]
  pull_request:
    paths: ["apps/api/Dockerfile", "apps/web/Dockerfile", "docker-compose.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          tags: overturn-${{ matrix.app }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
