name: Feature request
description: Something Overturn should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Which agent framework, model provider, review tool (Slack, Zendesk, your own UI)?
