[project]
name = "overturn"
version = "0.1.6"
description = "Overturn SDK: record agent runs, turn human corrections into regression cases, replay safely"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Overturn contributors" }]
dependencies = ["httpx>=0.27", "pydantic>=2.5", "uuid-utils>=0.9"]
keywords = ["llm", "agents", "evals", "regression-testing", "replay"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Typing :: Typed",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.30"]

[project.urls]
Homepage = "https://github.com/overrule-ai/overturn"
Repository = "https://github.com/overrule-ai/overturn"
Documentation = "https://github.com/overrule-ai/overturn/blob/main/docs/sdk.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["overturn"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pyright>=1.1.400", "openai>=1.40", "anthropic>=0.30", "ruff>=0.6"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["overturn", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.10"
reportMissingModuleSource = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "PIE807"]
